kit: dev-squad-kit
requires:
  external_services: []
verification:
  - "python ../../installers/kit-forge/tools/skill_lint.py --all skills --run-proofs"
hosts:
  claude-code:
    plugin: true
    manual_gates: []
  codex:
    plugin: false
    agents: AGENTS.md
    skills_path: .agents/skills
    runtime_path: .agents/hpp/dev-squad-kit
    manual_gates: [hooks]
docs: README.md
