# sources.yaml - map of domain -> LIVE verification command (live-source-prover)
# Copy to the project's sources.yaml and adjust the commands to the real stack.
# The skill runs the command, pastes the output and labels it "live @ HH:MM + source".
# NEVER use curl/wget if they are on the deny-list - prefer python -c urllib.

# NOTE: `counts` is the default section `live_count.py` reads when `--section` is omitted, and
# `agents` is the key its usage line shows as the `--key` example. The two were Portuguese until
# 2.5.3 and were renamed TOGETHER with the script - renaming the example alone would have broken
# the documented default silently, which is why an earlier pass deliberately left them.
counts:
  agents: "grep -rL 'status:.*draft' agents --include=AGENT.md | wc -l"
  skills:  "ls -1d .claude/skills/*/ | wc -l"
  hooks:   "ls -1 .claude/hooks/*.py | wc -l"
  tests:   "python -m pytest --collect-only -q tests | tail -1"

services:
  # health of a local service (urllib, not curl - respects the deny-list)
  api_health: "python -c \"import urllib.request,sys; print(urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=5).status)\""

deploy:
  # EXCLUSIVE route of the new build (not the auth gate) + build marker
  exclusive_route: "python -c \"import urllib.request; r=urllib.request.urlopen('https://staging.example.com/_health/new-route',timeout=8); print(r.status, r.read()[:200])\""

plan:
  # real completeness of a plan: see audit_plan.py
  real_status: "python operator-kit/scripts/audit_plan.py docs/plans/YOUR-PLAN.md --json"

git:
  recent_commits: "git log --oneline -5"
  recent_activity: "git log --all -i --grep"   # append the term when using it
