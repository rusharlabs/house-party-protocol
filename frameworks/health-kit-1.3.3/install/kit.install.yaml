kit: health-kit
requires:
  python: ">=3.8"
  pyyaml: true
  external_services: []
questions:
  - id: configurar_probes_agora
    prompt: "Configure the health probes (health.probes) now? (no = copies profile.example.yaml as is; you adjust it later — that is the default)"
    type: bool
    options: [true, false]
    default: false
verification:
  - "python scripts/health_probe.py --self-test"
  - "python statusline/statusline.py --self-test"
hosts:
  claude-code:
    plugin: true
    manual_gates: [statusLine, hooks, SessionStart]
  codex:
    plugin: false
    agents: AGENTS.md
    skills_path: .agents/skills
    runtime_path: .agents/hpp/health-kit
    manual_gates: [statusLine, hooks, SessionStart]
docs: README.md
