# kit.install.yaml — manifesto declarativo lido por kit_doctor.py install (6 estagios).
# Fonte da verdade de CADA campo: README.md, .claude-plugin/plugin.json, SETTINGS-WIRE.md,
# hooks/hooks.json e os proprios scripts (ver notas abaixo). Gerado 2026-07-11.

kit: operator-kit

requires:
  # Nenhum .py do kit usa sintaxe runtime pos-3.9 (sem walrus real, sem match-stmt, sem
  # dict|dict, sem removeprefix/zoneinfo/tomllib/Path.walk). TODOS os 27 arquivos .py
  # tem `from __future__ import annotations` -> as anotacoes `list[str]`/`str | None`
  # sao diferidas (seguras mesmo em Python antigo). Sem interpretador <3.9 disponivel
  # para testar empiricamente neste ambiente (so ha 3.14.3) -- >=3.9 e o piso conservador
  # do proprio marketplace, nao contradito por nenhuma evidencia encontrada.
  python: ">=3.9"
  # _lib/profile_loader.py + scripts/drift_check.py + scripts/live_count.py fazem
  # `import yaml` (guardado por try/except ImportError -- degrada pra {} sem PyYAML,
  # mas o mecanismo central de config so funciona de verdade com PyYAML presente).
  pyyaml: true
  # Nenhum servico externo com credencial e requerido. urllib.request em
  # scripts/health_probe.py e scripts/drift_check.py aponta pra alvos que o PROPRIO
  # operator-profile.yaml do usuario declara (health.probes, default []) -- generico,
  # nao um servico fixo do kit. NUNCA declarar ANTHROPIC_API_KEY aqui (regime e
  # assinatura/quota, nao pay-per-use).
  external_services: []

# SEM 'questions:' -- decisao deliberada, nao omissao por preguica (YAGNI, regra 5).
# A unica leitura de config real do kit e operator-profile.yaml, e ele NAO cabe em
# perguntas discretas de installer: e um arquivo com ~15 blocos (paths.* apontando pra
# arquivos que precisam EXISTIR no projeto-alvo, verificacao.done_criterios com comandos
# de teste especificos do stack, guardrails.protected_paths/branches, loop.*, statusline.*,
# health.probes...). Um default universal pra qualquer um desses campos seria ou inutil
# (ex.: done_criterios.py apontando pra um comando que nao existe no projeto-alvo) ou
# ativamente enganoso (fingir que o profile esta "configurado" quando so 1 de 15 blocos
# foi respondido). O kit_doctor.py JA tem o mecanismo certo pra isso, separado de
# 'questions': o estagio `stage_profile` (copia profile.example.yaml -> operator-profile.yaml
# SE nao existir, nunca sobrescreve) -- e o README/HANDOVER confirmam que e assim que este
# kit e instalado ("cp profile.example.yaml operator-profile.yaml e ajustar"). Forcar
# 1-2 campos (ex.: "qual autonomia inicial?") em 'questions:' ignoraria os outros 14
# blocos que ainda exigem edicao humana real -- por isso a chave inteira fica de fora.

verification:
  # Os 3 comandos abaixo foram RODADOS de verdade nesta sessao (cwd=staging/operator-kit,
  # Python 3.14.3) e confirmados exit 0. Os outros 24 .py do kit tambem foram varridos com
  # --self-test (mesmo criterio do estagio [smoke] do kit_doctor.py) e todos OK -- ver
  # relato completo na resposta desta tarefa.
  - "python scripts/done_gate.py --self-test"
  - "python hooks/rule_capture.py --self-test"
  - "python hooks/ralph_gate.py --self-test"

hosts:
  claude-code:
    # .claude-plugin/plugin.json existe (verificado no filesystem) e ja declara
    # "hooks": "./hooks/hooks.json" + "commands": "./commands" -- plugin funcional.
    plugin: true
    # install/wiring.settings.jsonc NAO existe neste kit (verificado: so SETTINGS-WIRE.md
    # existe na raiz). Diferente de continuity-kit/lane-kit, que TEM esse arquivo. Por isso
    # a chave 'wiring_spec' fica OMITIDA aqui (schema: "omita a chave se nao existir") --
    # ver nota completa na resposta desta tarefa. kit_doctor.py `stage_wire_suggest` ainda
    # funciona sem ela: detecta plugin.json (sugere /plugin install) e detecta
    # SETTINGS-WIRE.md na raiz (sugere "seguir SETTINGS-WIRE.md") por conta propria.
    #
    # manual_gates: tudo que SETTINGS-WIRE.md marca como GATE HUMANO (editar
    # .claude/settings.local.json). statusLine e SEMPRE manual (Claude Code nao aceita
    # statusLine dentro de plugin -- SETTINGS-WIRE.md secao 3). Os 3 eventos de hook
    # abaixo (confirmados em hooks/hooks.json: PreToolUse x2 matchers/5 hooks,
    # UserPromptSubmit x1, Stop x2) sao gate humano no caminho MANUAL alternativo
    # (SETTINGS-WIRE.md secao 1) -- o caminho plugin os arma automaticamente via
    # ${CLAUDE_PLUGIN_ROOT}, mas kit_doctor.py nunca aplica nenhum dos dois sozinho.
    manual_gates: [statusLine, PreToolUse, UserPromptSubmit, Stop]
  codex:
    plugin: false
    agents: AGENTS.md
    skills_path: .agents/skills
    runtime_path: .agents/hpp/operator-kit
    manual_gates: [statusLine, hooks, PreToolUse, UserPromptSubmit, Stop]

docs: README.md
