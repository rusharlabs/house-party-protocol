# sources.yaml — mapa domínio → comando de verificação AO VIVO (live-source-prover)
# Copie para sources.yaml do projeto e ajuste os comandos ao stack real.
# A skill roda o comando, cola o output e rotula "live @ HH:MM + fonte".
# NUNCA usar curl/wget se estiverem na deny-list — preferir python -c urllib.

contagens:
  agentes: "grep -rL 'status:.*draft' agents --include=AGENT.md | wc -l"
  skills:  "ls -1d .claude/skills/*/ | wc -l"
  hooks:   "ls -1 .claude/hooks/*.py | wc -l"
  testes:  "python -m pytest --collect-only -q tests | tail -1"

servicos:
  # health de um serviço local (urllib, não curl — respeita deny-list)
  api_health: "python -c \"import urllib.request,sys; print(urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=5).status)\""

deploy:
  # rota EXCLUSIVA do build novo (não o gate de auth) + marca de build
  rota_exclusiva: "python -c \"import urllib.request; r=urllib.request.urlopen('https://staging.exemplo.com/_health/rota-nova',timeout=8); print(r.status, r.read()[:200])\""

plano:
  # completude real de um plano: ver audit_plan.py
  status_real: "python operator-kit/scripts/audit_plan.py docs/plans/SEU-PLANO.md --json"

git:
  ultimos_commits: "git log --oneline -5"
  feito_recente: "git log --all -i --grep"   # anexe o termo ao usar
