kit: supabase-pack
requires:
  external_services:
    - name: Supabase
      via: MCP
      credenciais: "URL + anon key"
verification:
  - "python ../../instaladores/kit-forge/tools/skill_lint.py --all skills --run-proofs"
hosts:
  claude-code:
    plugin: true
    manual_gates: []
  codex:
    plugin: false
    agents: AGENTS.md
    skills_path: .agents/skills
    runtime_path: .agents/hpp/supabase-pack
    manual_gates: [hooks]
docs: README.md
