kit: claude-dev-kit
requires:
  python: ">=3.8"
  pyyaml: true
  external_services: []
# Sem 'questions:' — este kit não tem nenhum profile.example.* nem parâmetro
# configurável pelo usuário (YAGNI: wire_settings.py/install_git_hook.py são
# invocados com flags de CLI no momento do uso, não perguntas de instalação).
verification:
  - "python scripts/wire_settings.py --self-test"
  - "python scripts/install_git_hook.py --self-test"
  - "python tools/skill_lint.py --self-test"
  - "python docs/hook-template.py --self-test"
  - "python hooks/secret_scan_on_write.py --self-test"
hosts:
  claude-code:
    plugin: true
    wiring_spec: hooks/wiring-spec.yaml
    # wiring_spec aqui é PROGRAMÁTICO (consumido por scripts/wire_settings.py --spec),
    # diferente do wiring.settings.jsonc colar-humano de outros kits deste marketplace.
    manual_gates:
      - "settings.local.json hooks (PreToolUse Edit|Write|MultiEdit -> secret_scan_on_write): via `/plugin install` (rota oficial, auto-wire pelo próprio Claude Code) OU via `python scripts/wire_settings.py --spec hooks/wiring-spec.yaml --target .claude/settings.local.json` -- o wire nunca roda sozinho no install; o gate humano é quem invoca o comando (a ferramenta é idempotente e programática, não autônoma)"
      - "git hook .git/hooks/pre-commit: via `python scripts/install_git_hook.py --repo . --hook-name pre-commit --payload <payload.sh>` -- chain-preserving (encadeia com um pre-commit alheio já existente, nunca substitui); também só roda quando o humano invoca o comando"
docs: docs/SKILL-CONTRACT.md
