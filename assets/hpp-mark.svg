<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="House Party Protocol symbol">
  <title>House Party Protocol symbol</title>
  <defs>
    <linearGradient id="cromoEsq" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0"    stop-color="#5a5a5e"/>
      <stop offset="0.28" stop-color="#d8d8dc"/>
      <stop offset="0.55" stop-color="#f4f1eb"/>
      <stop offset="0.8"  stop-color="#9a9aa0"/>
      <stop offset="1"    stop-color="#3c3c40"/>
    </linearGradient>
    <linearGradient id="cromoDir" x1="1" y1="0" x2="0" y2="0.35">
      <stop offset="0"    stop-color="#48484c"/>
      <stop offset="0.3"  stop-color="#c6c6cb"/>
      <stop offset="0.58" stop-color="#eceae4"/>
      <stop offset="0.82" stop-color="#84848a"/>
      <stop offset="1"    stop-color="#2e2e32"/>
    </linearGradient>
    <linearGradient id="corpo" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0"   stop-color="#1b1b1d"/>
      <stop offset="0.5" stop-color="#0a0a0b"/>
      <stop offset="1"   stop-color="#141416"/>
    </linearGradient>
    <linearGradient id="feixe" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0"    stop-color="#ff7a18" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#ffb347" stop-opacity="0.95"/>
      <stop offset="0.6"  stop-color="#fff3d6"/>
      <stop offset="1"    stop-color="#ff6a00" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="flare" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#fffaf0"/>
      <stop offset="0.3" stop-color="#ffb347" stop-opacity="0.8"/>
      <stop offset="1"   stop-color="#ff6a00" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloom" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bloomForte" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- halo externo -->
  <rect x="44" y="44" width="424" height="424" rx="104" fill="none"
        stroke="#ff6a00" stroke-width="10" opacity="0.5" filter="url(#bloomForte)"/>

  <!-- corpo do badge -->
  <rect x="44" y="44" width="424" height="424" rx="104" fill="url(#corpo)"/>

  <!-- contorno quente, mais intenso em cima e embaixo -->
  <rect x="44" y="44" width="424" height="424" rx="104" fill="none"
        stroke="#ff8a2a" stroke-width="5" opacity="0.95" filter="url(#bloom)"/>

  <!-- os dois paineis cromados: portal aberto -->
  <path d="M168 150 L236 186 L236 356 L168 330 Z" fill="url(#cromoEsq)"/>
  <path d="M344 150 L276 186 L276 356 L344 330 Z" fill="url(#cromoDir)"/>
  <path d="M168 150 L236 186 L236 200 L168 166 Z" fill="#fdfcf8" opacity="0.55"/>
  <path d="M344 150 L276 186 L276 200 L344 166 Z" fill="#fdfcf8" opacity="0.45"/>

  <!-- feixe central -->
  <rect x="250" y="120" width="12" height="270" fill="url(#feixe)" filter="url(#bloom)"/>
  <ellipse cx="256" cy="262" rx="86" ry="10" fill="url(#flare)" opacity="0.85"/>
  <ellipse cx="256" cy="262" rx="12" ry="74" fill="url(#flare)" opacity="0.7"/>

  <!-- arco de piso -->
  <path d="M96 392 Q256 452 416 392" fill="none" stroke="#ff8a2a" stroke-width="7"
        stroke-linecap="round" opacity="0.9" filter="url(#bloom)"/>
</svg>
