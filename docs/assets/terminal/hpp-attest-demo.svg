  <title>python -m hpp attest · a stale approval is refused — measured output, 2026-09-28</title>
  <desc>Rendered from the command's real stdout by scripts/render_terminal_svg.py; no image was edited by hand. Commands, in the order they ran, and the whole lines of each stdout (or stderr, where noted) shown: 1) python -m hpp attest create --spec spec.md --output att.json --maker a --checker a --session s1 --verdict approved — line 1 of 1 on stderr, exit 2; 2) python -m hpp attest create --spec spec.md --output att.json --maker a --checker b --session s1 --verdict approved — lines 33-35 of 35, exit 0; 3) python -m hpp attest verify att.json — lines 1-10 of 10, exit 0; 4) python -c 'with open("app.py", "a") as f: f.write("#")' — no output, exit 0; 5) python -m hpp attest verify att.json — lines 1-12 of 12, exit 2. Every command ran in one temporary git repository, your-repo/, whose single commit holds spec.md and app.py under a fixed author and date, so the base commit shown is the same wherever the story is regenerated; the python -c line is the only edit, a line left out is counted on screen, a status other than 0 is shown as it was returned, and no line was edited.</desc>
