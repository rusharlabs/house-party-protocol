body:
  - type: markdown
    attributes:
      value: |
        A question lands faster with its command: paste what you ran, its exit code and what came
        back, and whoever answers can re-run it. English or Brazilian Portuguese are both fine;
        the answer comes in the language of the question.

        Not a question? Behaviour that contradicts the documentation is a
        [problem report](https://github.com/rusharlabs/house-party-protocol/issues/new?template=problem.yml).
        A vulnerability is never posted in public: use the
        [private advisory form](https://github.com/rusharlabs/house-party-protocol/security/advisories/new)
        or the contact channel named in SECURITY.md.
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What you are trying to do, and where you got stuck.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and output
      description: |
        The exact command, its exit code and what it printed. Not installed yet? Write "not installed".
        Remove tokens, secrets and personal paths before posting.
      render: shell
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: Host
      options:
        - Claude Code
        - Codex CLI
        - Both
        - Not host-specific (CLI only)
        - Not installed yet
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Version and platform
      description: |
        From 2.10 on, paste the output of `hpp doctor --report`: versions, platform and counts, with no path from your machine.
        On earlier versions, paste `hpp --version` and `hpp doctor`, plus your operating system and `python --version`.
        The output of `hpp doctor --json` includes the absolute path of the manifest; trim it before pasting.
      render: text
    validations:
      required: false
  - type: textarea
    id: checked
    attributes:
      label: What you already checked
      description: The README section, docs page, manual chapter or discussion you read, if any. A link is enough.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before posting
      options:
        - label: I searched the existing discussions and issues for this question.
          required: true
        - label: Nothing I pasted contains a token, a secret, a personal path or private data.
          required: true
