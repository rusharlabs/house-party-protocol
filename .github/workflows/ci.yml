name: CI

# Diagnostic branch only (diag/macos-dashboard): never merged. It times the Lane Dashboard
# self-test on macOS and dumps every thread's stack every 15 s while it runs, to show where it
# waits: it exceeds the kit doctor's 30 s smoke budget on macOS and not on Linux or Windows.
on:
  pull_request:

permissions:
  contents: read

jobs:
  diag:
    name: diag dashboard self-test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        python-version: ["3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install what the modules declare they need (PyYAML)
        run: python -m pip install --disable-pip-version-check --require-hashes -r .github/requirements/modules.txt

      - name: Dashboard self-test, timed, with a stack dump every 15 s
        continue-on-error: true
        run: |
          cd multi-session/lane-kit-1.7.0
          start=$(date +%s)
          python -B -X utf8 -c "import faulthandler, runpy, sys; faulthandler.dump_traceback_later(15, repeat=True); sys.argv = ['lane_dashboard.py', '--self-test']; runpy.run_path('scripts/lane_dashboard.py', run_name='__main__')" || echo "exit=$?"
          echo "ELAPSED $(( $(date +%s) - start )) s"

      - name: Processes left behind
        if: always()
        run: ps -axo pid,ppid,pgid,etime,command | grep -i python | grep -v grep || true
