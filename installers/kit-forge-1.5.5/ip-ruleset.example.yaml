# ip-ruleset.example.yaml — NEUTRAL example (this one CAN be part of a distributed kit)
#
# The real file (ip-ruleset.yaml, with the client names, ports and domains of YOUR shop)
# NEVER ships in a kit — it stays out of every kit assembler manifest. This example shows
# the SHAPE that whoever installs kit-forge should fill in for their own business.
version: 1

banned_terms:
  clients:
    # Client / client-person names of YOUR business. Each entry becomes a "client" match (BLOCK).
    - "acme-corp"
    - "cliente-exemplo"

  infra:
    # Ports, hosts, domains of YOUR internal infrastructure.
    - "127.0.0.1:9999"
    - "localhost:9999"
    - "minhaempresa-interna.example.com"

  identity:
    # Internal brand/product names that must not leak into a distributed kit (WARN by
    # default; BLOCK with --strict).
    - "NomeDoMeuSistemaInterno"

derived:
  # Signatures of third-party code that must NEVER be incorporated (always BLOCK).
  filenames:
    - "license.js"
    - "feature-gate.js"
  content:
    - "ProprietaryVendorName"

allow:
  # Auditable allowlist — every exception has an owner and a reason. Format:
  # - path: "relative/path"
  #   pattern: "regex or string"
  #   categoria: "secret|client|infra|pii|identity|derived|hygiene"
  #   justificativa: "why this match is an accepted false positive"
  #   autor: "name"
  #   data: "YYYY-MM-DD"

  # This very file is the EXAMPLE of the shape of an ip-ruleset.yaml — it necessarily
  # contains text that matches the very categories it describes (self-referential).
  - path: "ip-ruleset.example.yaml"
    pattern: '(acme-corp|cliente-exemplo)'
    categoria: client
    justificativa: "example term from the template file itself, not a real client"
    autor: "kit-forge"
    data: "2026-07-10"
  - path: "ip-ruleset.example.yaml"
    pattern: '(127\.0\.0\.1:9999|localhost:9999|minhaempresa-interna\.example\.com)'
    categoria: infra
    justificativa: "example endpoint from the template file itself, not real infra"
    autor: "kit-forge"
    data: "2026-07-10"
  - path: "ip-ruleset.example.yaml"
    pattern: 'ProprietaryVendorName'
    categoria: derived
    justificativa: "example signature from the template file itself (derived.content), not real third-party code"
    autor: "kit-forge"
    data: "2026-07-10"
  - path: "ip-ruleset.example.yaml"
    pattern: '(?i)nomedomeusistemainterno'
    categoria: identity
    justificativa: "example brand name from the template file itself (identity), not a real system. Case-insensitive pattern because the identity matcher lowercases the term before comparing (raw_match is always lowercase), unlike client/infra, which were already lowercase in the existing examples."
    autor: "kit-forge"
    data: "2026-07-14"

  # Self-test fixtures of ip_pii_linter.py itself (positive proof of the detectors:
  # secret/client/infra/pii-cnpj/pii-cpf) — fake strings, never real data.
  - path: "ip_pii_linter.py"
    pattern: '1234567890abcdef1234'
    categoria: secret
    justificativa: "self-test fixture (proves the secret.anthropic detector works) — pattern deliberately without the sk-ant- prefix, so the allow entry's own text does not detect itself"
    autor: "kit-forge"
    data: "2026-07-10"
  - path: "ip_pii_linter.py"
    pattern: 'acme-client-x'
    categoria: client
    justificativa: "self-test fixture (client.banned_term), never a real client"
    autor: "kit-forge"
    data: "2026-07-10"
  - path: "ip_pii_linter.py"
    pattern: '127\.0\.0\.1:9999'
    categoria: infra
    justificativa: "self-test fixture (infra.banned_term), neutral example port"
    autor: "kit-forge"
    data: "2026-07-10"
  - path: "ip_pii_linter.py"
    pattern: '11\.222\.333/0001-8[01]'
    categoria: pii
    justificativa: "CNPJ self-test fixture (valid/invalid pair to prove _cnpj_valid) — generic sequence, does not correspond to any known real company"
    autor: "kit-forge"
    data: "2026-07-10"
  - path: "ip_pii_linter.py"
    pattern: '111\.444\.777-35'
    categoria: pii
    justificativa: "valid-CPF self-test fixture — generic placeholder, does not correspond to any known real person"
    autor: "kit-forge"
    data: "2026-07-10"

  # Self-test fixture of kit_assembler.py — proves the gate BLOCKS sabotage
  # (planted secret) and ZERO emission happens.
  - path: "kit_assembler.py"
    pattern: 'FAKE1234567890abcd'
    categoria: secret
    justificativa: "self-test fixture (proves that sabotage with a planted secret is blocked, exit 2, zero emission) — pattern deliberately without the sk-ant- prefix"
    autor: "kit-forge"
    data: "2026-07-10"
