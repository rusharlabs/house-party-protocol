kit: gotcha-memory
requires:
  python: ">=3.8"
  pyyaml: false   # opcional — só p/ profile e seed em YAML; o core (JSONL) é stdlib puro
  external_services: []
questions:
  - id: seedar_curated_agora
    prompt: "Seedar lições curated iniciais agora a partir de curated.seed.example.yaml? (não = começa vazio; você seeda depois com --seed — é o default; edite o exemplo antes, ele é genérico)"
    type: bool
    options: [true, false]
    default: false
verification:
  - "python _lib/error_strategy.py --self-test"
  - "python _lib/gotchas_memory.py --self-test"
  - "python hooks/gotcha_preflight.py --self-test"
  - "python hooks/gotcha_postflight.py --self-test"
hosts:
  claude-code:
    plugin: true
    manual_gates: [hooks, PreToolUse, PostToolUse]
docs: README.md
