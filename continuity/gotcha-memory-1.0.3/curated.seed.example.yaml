# curated.seed.example.yaml — EXAMPLE curated lessons (generic, no personal data).
# Edit/replace them with YOUR rules before seeding. Each entry:
#   key:        substring matched against the task_key (the Bash description), or "*" = always-on
#   prevention: the actionable lesson (what the agent must do/avoid)
#   severity:   0-100 (weight in the ordering of the preamble; default 90)
#   family:     optional (default "manual")
#
# Seed (idempotent — re-running does not duplicate):
#   python _lib/gotchas_memory.py --seed curated.seed.example.yaml
#
# The five below are real lessons, each bought by an incident. They are here as a SHAPE, not as
# a prescription: a good lesson names the failure it prevents and what to do instead, and it is
# short enough to read at the top of a task. Replace them with yours.

- key: "deploy"
  prevention: "Deploy/routing: prove the BACKEND changed (a route exclusive to the new version + a build marker), not just the auth gate or the process status."
  severity: 92

- key: "count"
  prevention: "Before citing any number, count or status, audit the source LIVE - treat data from a previous session or from a document as suspect until reconfirmed."
  severity: 90

- key: "new script"
  prevention: "grep/ls BEFORE creating a new script or marking an item as pending/orphaned - 'pending' is a hypothesis to refute, not a fact."
  severity: 85

- key: "rm "
  prevention: "A destructive action needs a WRITTEN rollback before it runs (snapshot -> action -> verify). With no rollback ready, do not execute."
  severity: 95

- key: "migrat"
  prevention: "Migration or schema change: a verified backup first; test the parser/consumer against the REAL SHAPE of the data, never an invented one."
  severity: 90
