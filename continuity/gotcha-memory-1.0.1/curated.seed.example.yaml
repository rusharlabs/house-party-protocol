# curated.seed.example.yaml — EXAMPLE curated lessons (generic, no personal data).
# Edit/replace them with YOUR rules before seeding. Each entry:
#   key:        substring matched against the task_key (the Bash description), or "*" = always-on
#   prevention: the actionable lesson (what the agent must do/avoid)
#   severity:   0-100 (weight in the ordering of the preamble; default 90)
#   family:     optional (default "manual")
#
# Seed (idempotent — re-running does not duplicate):
#   python _lib/gotchas_memory.py --seed curated.seed.example.yaml
#
# The lessons below are DATA: the operator's own learned corrections, kept in the language they
# were written in (lesson #1 is quoted verbatim as proof output in skills/gotcha-memory/SKILL.md).
# Replace them with lessons in your own language before seeding.

- key: "deploy"
  prevention: "Deploy/routing: verifique que o BACKEND trocou (rota exclusiva da versão nova + marca de build), não só o gate de auth ou o status do processo."
  severity: 92

- key: "contagem"
  prevention: "Antes de citar qualquer número/contagem/status, audite a fonte AO VIVO — trate dado de sessão anterior ou de doc como suspeito até reconfirmar."
  severity: 90

- key: "criar script"
  prevention: "grep/ls ANTES de criar script novo ou marcar item como pendente/órfão — 'pendente' é hipótese a refutar, não verdade."
  severity: 85

- key: "rm "
  prevention: "Ação destrutiva exige rollback ESCRITO antes de executar (snapshot → ação → verify). Sem rollback pronto, não execute."
  severity: 95

- key: "migra"
  prevention: "Migração/alteração de schema: backup verificado antes; teste o parser/consumidor contra a FORMA REAL do dado, não contra forma inventada."
  severity: 90
