# ip-ruleset.example.yaml — exemplo NEUTRO (este SIM pode compor um kit distribuído)
#
# O arquivo real (ip-ruleset.yaml, com os nomes de cliente, porta e domínio da SUA casa)
# NUNCA sai num kit — fica de fora do manifesto de qualquer kit assembler. Este exemplo
# mostra a FORMA que quem instala o kit-forge deve preencher para o próprio negócio.
version: 1

banned_terms:
  clients:
    # Nomes de cliente/pessoa-cliente do SEU negócio. Cada entrada vira um match "client" (BLOCK).
    - "acme-corp"
    - "cliente-exemplo"

  infra:
    # Portas, hosts, domínios da SUA infraestrutura interna.
    - "127.0.0.1:9999"
    - "localhost:9999"
    - "minhaempresa-interna.example.com"

  identity:
    # Nomes de marca/produto internos que não devem vazar num kit distribuído (WARN por
    # default; BLOCK com --strict).
    - "NomeDoMeuSistemaInterno"

derived:
  # Assinaturas de código de terceiro que NUNCA pode ser incorporado (BLOCK sempre).
  filenames:
    - "license.js"
    - "feature-gate.js"
  content:
    - "ProprietaryVendorName"

allow:
  # Allowlist auditável — cada exceção tem dono e motivo. Formato:
  # - path: "caminho/relativo"
  #   pattern: "regex ou string"
  #   categoria: "secret|client|infra|pii|identity|derived|hygiene"
  #   justificativa: "por que este match é um falso-positivo aceito"
  #   autor: "nome"
  #   data: "YYYY-MM-DD"

  # Este próprio arquivo é o EXEMPLO da forma de um ip-ruleset.yaml — ele necessariamente
  # contém texto que casa com as próprias categorias que descreve (auto-referencial).
  - path: "ip-ruleset.example.yaml"
    pattern: '(acme-corp|cliente-exemplo)'
    categoria: client
    justificativa: "termo de exemplo do próprio arquivo-modelo, não cliente real"
    autor: "kit-forge"
    data: "2026-07-10"
  - path: "ip-ruleset.example.yaml"
    pattern: '(127\.0\.0\.1:9999|localhost:9999|minhaempresa-interna\.example\.com)'
    categoria: infra
    justificativa: "endpoint de exemplo do próprio arquivo-modelo, não infra real"
    autor: "kit-forge"
    data: "2026-07-10"
  - path: "ip-ruleset.example.yaml"
    pattern: 'ProprietaryVendorName'
    categoria: derived
    justificativa: "assinatura de exemplo do próprio arquivo-modelo (derived.content), não código de terceiro real"
    autor: "kit-forge"
    data: "2026-07-10"
  - path: "ip-ruleset.example.yaml"
    pattern: '(?i)nomedomeusistemainterno'
    categoria: identity
    justificativa: "nome de marca de exemplo do próprio arquivo-modelo (identity), não sistema real -- gap encontrado ao rodar --strict pela 1a vez neste kit (dev-squad-kit F4). Pattern case-insensitive porque o matcher de identity lowercase o termo antes de comparar (raw_match sempre minusculo), diferente de client/infra que ja eram lowercase nos exemplos existentes."
    autor: "kit-forge"
    data: "2026-07-14"

  # Fixtures de self-test do próprio ip_pii_linter.py (prova positiva dos detectores:
  # secret/client/infra/pii-cnpj/pii-cpf) — strings falsas, nunca dado real.
  - path: "ip_pii_linter.py"
    pattern: '1234567890abcdef1234'
    categoria: secret
    justificativa: "fixture de self-test (prova que o detector de secret.anthropic funciona) — pattern sem o prefixo sk-ant- de propósito, p/ o próprio texto do allow não se autodetectar"
    autor: "kit-forge"
    data: "2026-07-10"
  - path: "ip_pii_linter.py"
    pattern: 'acme-client-x'
    categoria: client
    justificativa: "fixture de self-test (client.banned_term), nunca cliente real"
    autor: "kit-forge"
    data: "2026-07-10"
  - path: "ip_pii_linter.py"
    pattern: '127\.0\.0\.1:9999'
    categoria: infra
    justificativa: "fixture de self-test (infra.banned_term), porta de exemplo neutra"
    autor: "kit-forge"
    data: "2026-07-10"
  - path: "ip_pii_linter.py"
    pattern: '11\.222\.333/0001-8[01]'
    categoria: pii
    justificativa: "fixture de self-test de CNPJ (par válido/inválido para provar _cnpj_valid) — sequência genérica, não corresponde a empresa real conhecida"
    autor: "kit-forge"
    data: "2026-07-10"
  - path: "ip_pii_linter.py"
    pattern: '111\.444\.777-35'
    categoria: pii
    justificativa: "fixture de self-test de CPF válido — placeholder genérico, não corresponde a pessoa real conhecida"
    autor: "kit-forge"
    data: "2026-07-10"

  # Fixture de self-test do kit_assembler.py — prova que o gate BLOQUEIA sabotagem
  # (segredo plantado) e ZERO emissão acontece.
  - path: "kit_assembler.py"
    pattern: 'FAKE1234567890abcd'
    categoria: secret
    justificativa: "fixture de self-test (prova que sabotagem com segredo plantado é bloqueada, exit 2, zero emissão) — pattern sem o prefixo sk-ant- de propósito"
    autor: "kit-forge"
    data: "2026-07-10"
